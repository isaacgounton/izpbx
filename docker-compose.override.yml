version: "3.8"

services:
  # Enhanced MySQL client configuration fix to prevent authentication errors
  # This sets up proper MySQL defaults and ensures MySQL password is properly configured
  izpbx:
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./izpbx-mysql-fix.sh:/usr/local/bin/izpbx-mysql-fix.sh:ro
    environment:
      - MYSQL_USER=asterisk
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=asterisk
      - MYSQL_TCP_PORT=3306
      - MYSQL_HOST=db
      - TZ=${TZ}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo 'Waiting for database to be ready...'
        until nc -z db 3306; do
          echo 'Waiting for MySQL...'
          sleep 2
        done
        echo 'Database is ready!'
        /bin/bash /usr/local/bin/izpbx-mysql-fix.sh
        exec supervisord -c /etc/supervisord.conf

  # Enhanced database configuration for better compatibility
  db:
    environment:
      - MYSQL_DATABASE=asterisk
      - MYSQL_USER=asterisk
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: >
      --sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
      --init-file=/dev/null
      --log-warnings=1
      --skip-name-resolve
      --skip-networking=0
      --bind-address=0.0.0.0
      --port=3306
      --default-authentication-plugin=mysql_native_password
